name: Build and Push Docker Image

on:
  push:
    branches: [ main, production ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: rehanmohiuddin1623/med-assist-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate deployment artifacts
      if: github.ref == 'refs/heads/production'
      run: |
        mkdir -p deploy
        
        # Create production docker-compose file
        cat > deploy/docker-compose.prod.yml << 'EOF'
        version: '3.8'
        
        services:
          postgres:
            image: postgres:15-alpine
            container_name: med-assist-postgres
            restart: unless-stopped
            environment:
              POSTGRES_DB: medassist
              POSTGRES_USER: medassist
              POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            volumes:
              - postgres_data:/var/lib/postgresql/data
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U medassist -d medassist"]
              interval: 30s
              timeout: 10s
              retries: 3
        
          redis:
            image: redis:7-alpine
            container_name: med-assist-redis
            restart: unless-stopped
            volumes:
              - redis_data:/data
            healthcheck:
              test: ["CMD", "redis-cli", "ping"]
              interval: 30s
              timeout: 10s
              retries: 3
        
          app:
            image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            container_name: med-assist-app
            restart: unless-stopped
            ports:
              - "8000:8000"
            environment:
              DATABASE_URL: postgresql://medassist:${POSTGRES_PASSWORD}@postgres:5432/medassist
              APP_HOST: 0.0.0.0
              APP_PORT: 8000
              DEBUG: "False"
              TTS_VOICE: aura-asteria-en
              TTS_SPEED: "1.0"
              JWT_SECRET_KEY: ${JWT_SECRET_KEY}
              OPENAI_API_KEY: ${OPENAI_API_KEY}
              DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
              TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
              TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
              TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
              WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
            depends_on:
              postgres:
                condition: service_healthy
              redis:
                condition: service_healthy
            healthcheck:
              test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
              interval: 30s
              timeout: 10s
              retries: 3
              start_period: 40s
        
          nginx:
            image: nginx:alpine
            container_name: med-assist-nginx
            restart: unless-stopped
            ports:
              - "80:80"
              - "443:443"
            volumes:
              - ./nginx.conf:/etc/nginx/nginx.conf:ro
              - ./ssl:/etc/nginx/ssl:ro
            depends_on:
              - app
        
        volumes:
          postgres_data:
          redis_data:
        EOF
        
        # Create deployment script
        cat > deploy/deploy.sh << 'EOF'
        #!/bin/bash
        
        set -e
        
        # Colors for output
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        NC='\033[0m'
        
        print_status() {
            echo -e "${GREEN}[INFO]${NC} $1"
        }
        
        print_warning() {
            echo -e "${YELLOW}[WARNING]${NC} $1"
        }
        
        print_error() {
            echo -e "${RED}[ERROR]${NC} $1"
        }
        
        print_header() {
            echo -e "${BLUE}=====================================${NC}"
            echo -e "${BLUE} Med Assist Agent - Auto Deployment${NC}"
            echo -e "${BLUE}=====================================${NC}"
        }
        
        check_requirements() {
            # Check if Docker is installed
            if ! command -v docker &> /dev/null; then
                print_error "Docker is not installed. Please install Docker first."
                exit 1
            fi
            
            # Check if Docker Compose is installed
            if ! command -v docker-compose &> /dev/null; then
                print_error "Docker Compose is not installed. Please install Docker Compose first."
                exit 1
            fi
            
            # Check if .env file exists
            if [ ! -f .env ]; then
                print_error ".env file not found. Please create one with your configuration."
                exit 1
            fi
        }
        
        backup_database() {
            if docker ps | grep -q med-assist-postgres; then
                print_status "Creating database backup..."
                mkdir -p backups
                docker exec med-assist-postgres pg_dump -U medassist medassist > "backups/backup-$(date +%Y%m%d-%H%M%S).sql"
                print_status "Database backup created successfully!"
            fi
        }
        
        deploy() {
            print_header
            check_requirements
            
            print_status "Starting deployment..."
            
            # Backup database if it exists
            backup_database
            
            # Pull latest images
            print_status "Pulling latest Docker images..."
            docker-compose -f docker-compose.prod.yml pull
            
            # Stop existing containers
            print_status "Stopping existing containers..."
            docker-compose -f docker-compose.prod.yml down
            
            # Start new containers
            print_status "Starting updated containers..."
            docker-compose -f docker-compose.prod.yml up -d
            
            # Wait for services to be ready
            print_status "Waiting for services to be ready..."
            sleep 30
            
            # Check health
            print_status "Checking service health..."
            if curl -f http://localhost:8000/health &> /dev/null; then
                print_status "✅ Deployment successful! Application is healthy."
            else
                print_error "❌ Deployment failed! Application health check failed."
                exit 1
            fi
            
            # Clean up old images
            print_status "Cleaning up old Docker images..."
            docker image prune -f
            
            print_status "🚀 Deployment completed successfully!"
            print_status "Application is running at: http://$(hostname -I | awk '{print $1}'):8000"
        }
        
        # Main execution
        case "${1:-deploy}" in
            deploy)
                deploy
                ;;
            backup)
                backup_database
                ;;
            *)
                echo "Usage: $0 [deploy|backup]"
                exit 1
                ;;
        esac
        EOF
        
        chmod +x deploy/deploy.sh
        
        # Create nginx config for production
        cat > deploy/nginx.conf << 'EOF'
        events {
            worker_connections 1024;
        }
        
        http {
            upstream app {
                server app:8000;
            }
        
            # Rate limiting
            limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
        
            # Gzip compression
            gzip on;
            gzip_vary on;
            gzip_min_length 10240;
            gzip_proxied expired no-cache no-store private must-revalidate;
            gzip_types
                text/plain
                text/css
                text/xml
                text/javascript
                application/json
                application/javascript
                application/xml+rss
                application/atom+xml
                image/svg+xml;
        
            server {
                listen 80;
                server_name _;
        
                # Security headers
                add_header X-Frame-Options DENY;
                add_header X-Content-Type-Options nosniff;
                add_header X-XSS-Protection "1; mode=block";
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
                # Rate limiting
                limit_req zone=api burst=50 nodelay;
        
                # Proxy to FastAPI app
                location / {
                    proxy_pass http://app;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    
                    # WebSocket support
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    
                    # Timeouts
                    proxy_connect_timeout 60s;
                    proxy_send_timeout 60s;
                    proxy_read_timeout 60s;
                }
        
                # Health check endpoint
                location /health {
                    proxy_pass http://app/health;
                    access_log off;
                }
            }
        }
        EOF

    - name: Upload deployment artifacts
      if: github.ref == 'refs/heads/production'
      uses: actions/upload-artifact@v3
      with:
        name: deployment-files
        path: deploy/
        retention-days: 30