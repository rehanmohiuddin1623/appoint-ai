# Docker Compose override for development
# This file is automatically used by docker-compose to override settings
version: '3.8'

services:
  app:
    build:
      target: development
    volumes:
      # Mount source code for hot reloading (development only)
      - .:/app
      - /app/__pycache__
    environment:
      DEBUG: "True"
      PYTHONPATH: /app
    command: ["python", "-m", "uvicorn", "api_endpoints:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    
  postgres:
    ports:
      # Expose postgres on host for development tools
      - "5432:5432"
      
  redis:
    ports:
      # Expose redis on host for development tools  
      - "6379:6379"